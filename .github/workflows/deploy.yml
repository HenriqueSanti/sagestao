name: Deploy Produção Node/SQLite

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Sincronizar com a pasta de produção
        run: |
          mkdir -p /var/www/apps/sagestao
          # Copia os arquivos novos sem destruir dados persistentes existentes
          cp -r . /var/www/apps/sagestao/
          chown -R $USER:$USER /var/www/apps/sagestao

      - name: Instalar dependências e preparar ambiente
        run: |
          cd /var/www/apps/sagestao
          npm install --production
          
          # (Opcional) Reiniciar o serviço Systemd da aplicação para assumir o novo código
          # systemctl restart sagestao.service

      - name: Configurar e Iniciar Serviço Systemd Automaticamente
        run: |
          SERVICE_FILE="/etc/systemd/system/sagestao.service"
          
          # Verifica se o arquivo de serviço já existe; se não existir, ele cria automaticamente
          if [ ! -f "$SERVICE_FILE" ]; then
            echo "Criando o serviço Systemd para o projeto..."
            bash -c "cat > $SERVICE_FILE" <<EOF
          [Unit]
          Description=Aplicacao Node.js - Meu Projeto
          After=network.target

          [Service]
          Type=simple
          User=henrique
          WorkingDirectory=/var/www/apps/sagestao
          ExecStart=/usr/bin/node /var/www/apps/sagestao/index.js
          Restart=always
          Environment=NODE_ENV=production

          [Install]
          WantedBy=multi-user.target
          EOF

            # Recarrega o systemd, habilita e inicia o serviço pela primeira vez
            systemctl daemon-reload
            systemctl enable sagestao.service
            systemctl start sagestao.service
          else
            echo "O serviço já existe. Apenas reiniciando para aplicar atualizações..."
            systemctl restart sagestao.service
          fi